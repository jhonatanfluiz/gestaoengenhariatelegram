  <path d="M72 64L128 40L184 64" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="cyan_gradient" x1="72" y1="40" x2="184" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4" />
