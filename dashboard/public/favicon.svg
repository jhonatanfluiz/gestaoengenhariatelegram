  <rect width="256" height="256" rx="64" fill="#0f172a" />
  
  <!-- Outer glowing border -->
  <rect x="16" y="16" width="224" height="224" rx="48" stroke="url(#cyan_gradient)" stroke-width="4" stroke-opacity="0.5" />
  
  <!-- Building Outline (Left and Right Columns of H) -->
  <path d="M72 192V64H96V192H72Z" fill="url(#cyan_gradient)" />
  <path d="M160 192V64H184V192H160Z" fill="url(#cyan_gradient)" />
  
  <!-- Elevator Shaft (Middle beam of H) -->
  <path d="M96 120H160V136H96V120Z" fill="#1e293b" />
  
  <!-- The Elevator Car (Moving up/down) -->
  <rect x="112" y="80" width="32" height="40" rx="8" fill="#f59e0b" />
  
  <!-- Elevator glowing lines (windows/accents) -->
  <rect x="120" y="88" width="16" height="8" rx="2" fill="#fff" fill-opacity="0.9" />
  <rect x="120" y="104" width="16" height="8" rx="2" fill="#fff" fill-opacity="0.9" />
  
